nav{display:flex;gap:22px;margin-left:auto;align-items:center}

nav a{font-weight:900;letter-spacing:.14em;text-decoration:none;font-
size:.95rem;text-transform:uppercase}

.cartbtn{background:var(--pink);color:#fff;border:0;border-
radius:999px;padding:12px 22px;font:900 .95rem Lato,sans-serif;letter-
spacing:.1em;cursor:pointer;text-transform:uppercase}

.hero{padding:64px 20px 90px;background:radial-gradient(60% 50% at 70% 45%,#ecb6d6
0,transparent 70%),linear-gradient(var(--soft),var(--bg))}
.hero h1{margin:0;font:900 clamp(4.5rem,22vw,11rem)/.85 Lato,sans-serif;letter-

spacing:-.02em;color:transparent;-webkit-text-stroke:3px var(--ink);text-
transform:uppercase}

.tag{font:700 clamp(1.6rem,6vw,2.4rem)/1.35 Caveat,cursive;color:var(--pink);max-
width:20ch;margin:22px 0 32px;transform:rotate(-2deg)}

.btns{display:flex;gap:14px;flex-wrap:wrap}

.btn{display:inline-block;padding:20px 28px;font:900 1rem Lato,sans-serif;letter-
spacing:.12em;text-transform:uppercase;text-decoration:none;border:3px solid var(-

-ink);cursor:pointer}
.btn.fill{background:var(--ink);color:var(--bg)}
.btn.line{background:transparent;color:var(--ink)}
section{padding:56px 20px;max-width:1100px;margin:0 auto}

h2{font:900 clamp(2rem,8vw,3.2rem)/1 Lato,sans-serif;margin:0 0 28px;text-
transform:uppercase;letter-spacing:-.01em}

.grid{display:grid;grid-template-columns:repeat(auto-
fill,minmax(260px,1fr));gap:22px}

.card{background:var(--surface);border:1px solid var(--
line);position:relative;display:flex;flex-direction:column}
.card.drop{border-color:var(--pink)}

.ph{display:block;width:100%;object-fit:cover;aspect-ratio:4/5;background:linear-
gradient(160deg,#e4e2e6,#c9c6cc);display:grid;place-
items:center;color:#777;font:700 1.3rem Caveat,cursive;text-
align:center;padding:16px}

.badge{position:absolute;top:14px;left:0;background:var(--
pink);color:#fff;font:900 .8rem Lato,sans-serif;letter-spacing:.14em;padding:6px
14px;border-radius:0 999px 999px 0}
.info{padding:18px}
.info h3{margin:0;font:900 1.3rem Lato,sans-serif}
.price{color:var(--muted);font-size:1.15rem;margin:4px 0 14px}

.sizes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-
bottom:14px}

.sizes button{padding:12px 0;border:2px solid var(--line);border-
radius:6px;background:var(--surface);color:var(--ink);font:700 1.05rem Lato,sans-
serif;cursor:pointer}

.sizes button[aria-pressed="true"]{border-color:var(--ink);background:var(--
ink);color:var(--bg)}

.add{width:100%;background:var(--pink);color:#fff;border:0;border-
radius:6px;padding:16px;font:900 1rem Lato,sans-serif;letter-
spacing:.1em;cursor:pointer;text-transform:uppercase}

.err{color:var(--pink);font-weight:700;min-height:1.3em;margin:8px 0 0;font-
size:.9rem}

.contact p{max-width:46ch;margin:0 0 22px}
.contact form{display:grid;gap:12px;max-width:520px}
.contact input,.contact textarea{padding:14px;border:2px solid var(--

line);background:var(--surface);color:var(--ink);font:1rem Lato,sans-serif;border-
radius:6px}

footer{padding:30px 20px 50px;text-align:center;color:var(--muted)}

#drawer{position:fixed;top:0;right:0;bottom:0;width:min(100%,400px);background:var(-

-surface);border-left:3px solid var(--ink);z-
index:20;transform:translateX(105%);transition:transform .25s;padding:calc(20px +

env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-
bottom,0px));display:flex;flex-direction:column}

#drawer.open{transform:none}
#drawer h2{font-size:1.8rem;margin-bottom:16px}
#items{flex:1;overflow:auto;list-style:none;padding:0;margin:0}
#items li{display:flex;justify-content:space-between;gap:10px;padding:12px
0;border-bottom:1px solid var(--line)}

#items button{background:none;border:0;color:var(--pink);font-
weight:900;cursor:pointer}

.total{font:900 1.2rem Lato,sans-serif;margin:16px 0}

@media (prefers-reduced-motion:reduce){html{scroll-
behavior:auto}#drawer{transition:none}}

@media (max-width:520px){nav{gap:12px}nav a{font-size:.8rem}.cartbtn{padding:10px
14px;font-size:.8rem}}
</style>
